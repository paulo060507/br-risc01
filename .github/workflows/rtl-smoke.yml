name: RTL smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  iverilog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run BR-RISC01 smoke test
        run: make sim
